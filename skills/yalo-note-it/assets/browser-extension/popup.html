<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ChatGPT Conversation Capture</title>
    <style>
      body {
        box-sizing: border-box;
        width: 260px;
        margin: 0;
        padding: 14px;
        color: #171717;
        font: 14px/1.45 system-ui, sans-serif;
        background: #f7f5ef;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
        margin: 0 0 14px;
      }
      .brand img { width: 28px; height: 28px; }
      h1 { margin: 0; font-size: 15px; letter-spacing: -0.01em; }
      button {
        width: 100%;
        margin: 0 0 8px;
        padding: 9px 12px;
        border: 1px solid #c9c5bb;
        border-radius: 8px;
        color: #171717;
        background: #fff;
        cursor: pointer;
      }
      button.primary { color: #f7f5ef; border-color: #171717; background: #171717; }
      button.danger { color: #b42318; }
      #status { min-height: 20px; color: #666158; font-size: 12px; }
    </style>
  </head>
  <body>
    <div class="brand">
      <img src="icons/icon-32.png" alt="">
      <h1>Yalo note it</h1>
    </div>
    <button id="configure">设置本地记录目录</button>
    <button id="record" class="primary">Yalo note it</button>
    <button id="stop" class="danger">停止当前任务</button>
    <div id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
